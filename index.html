
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Element Checker</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Roboto Condensed', sans-serif;
            color: white;
            background: #080808;
            animation: club-fade-in 0.8s ease-out forwards;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding: 35px 20px 10px;
        }

        header h1 {
            font-size: clamp(32px, 5vw, 58px);
            margin: 0 0 12px;
            font-weight: 700;
        }

        header p {
            max-width: 750px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.5;
        }

        main {
            width: min(420px, calc(100% - 40px));
            box-sizing: border-box;
            margin: 45px auto;
            padding: 30px 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            color: #222;
            font: inherit;
            font-size: 16px;
        }

        input[type="text"]::placeholder {
            color: #777;
        }

        input[type="button"] {
            margin-top: 12px;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            background: white;
            color: black;
            font: inherit;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background: #dcdcdc;
        }

        #result {
            margin-top: 22px;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

    </style>
</head>

<body>

    <video class="video-background" autoplay muted loop playsinline>
        <source src="getobg.mp4" type="video/mp4">
    </video>

    <header>
        <h1>ELEMENT CHECKER</h1>
        <p>Enter the name of a non-metal element to view its symbol, atomic number, and atomic mass. Make sure it's non-metal, however!</p>
    </header>

    <main>
        <h2>Element Information and Checker</h2>

        <input
            type="text"
            id="element"
            placeholder="What Element is on your mind?"
        >

        <input
            type="button"
            value="Check Element"
            py-click="check_element"
        >

        <div id="result"></div>
    </main>

    <script type="py" src="./main.py"></script>

</body>
</html>
